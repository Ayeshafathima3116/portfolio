                  </div>
                  <div className="p-8 -mt-20 relative z-10">
                    <h3 className="text-2xl font-black mb-4 text-white group-hover:text-primary transition-colors">{p.title}</h3>
                    <p className="text-slate-400 mb-6 leading-relaxed text-base line-clamp-2">{p.description}</p>
                    <div className="flex flex-wrap gap-3 mb-8">
                      {p.tech.map(t => <span key={t} className="px-4 py-1.5 bg-white/5 rounded-full text-xs font-bold border border-white/10 uppercase">{t}</span>)}
                    </div>
                    <div className="flex items-center justify-between">
                      <a href={p.github} target="_blank" className="flex items-center gap-3 text-primary font-black uppercase text-sm group/btn hover:gap-6 transition-all tracking-widest">
                        Source Code <i data-lucide="github" className="w-5 h-5"></i>
                      </a>
                      <div className="w-12 h-12 glass rounded-full flex items-center justify-center text-white transform group-hover:rotate-45 transition-transform">
                        <i data-lucide="arrow-up-right"></i>
                      </div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    };

    const Education = () => (
      <section id="education" className="py-20 bg-slate-950/40 relative">
        <div className="container mx-auto px-6">
          <h2 className="text-4xl md:text-5xl font-outfit font-black mb-20 text-center uppercase tracking-tighter" data-aos="fade-up">Learning <span className="text-primary">Timeline</span></h2>
          <div className="max-w-5xl mx-auto space-y-12 relative">
            <div className="absolute left-8 md:left-1/2 top-0 bottom-0 w-px bg-gradient-to-b from-primary/50 via-secondary/50 to-transparent"></div>
            {STUDENT_DATA.education.map((edu, idx) => (
              <div key={idx} className={`flex flex-col md:flex-row gap-12 items-center relative ${idx % 2 === 0 ? 'md:flex-row-reverse' : ''}`} data-aos={idx % 2 === 0 ? "fade-left" : "fade-right"}>
                <div className="absolute left-8 md:left-1/2 -translate-x-1/2 w-6 h-6 rounded-full bg-slate-950 border-4 border-primary shadow-[0_0_15px_rgba(34,211,238,0.5)] z-20"></div>
                <div className="w-full md:w-1/2 md:px-12 text-left md:text-right hidden md:block">
                  <div className="text-primary font-black text-2xl tracking-tighter opacity-70 italic">{edu.period}</div>
                </div>
                <div className="w-full md:w-1/2 pl-12 md:pl-0">
                  <div className="glass-card p-8 rounded-[2rem] hover:scale-[1.02] transition-transform">
                    <span className="text-primary font-black text-sm tracking-[0.3em] uppercase md:hidden mb-4 block">{edu.period}</span>
                    <h3 className="text-2xl font-black mb-3 text-white uppercase">{edu.degree}</h3>
                    <p className="text-primary font-bold mb-4">{edu.institute}</p>
                    <p className="text-slate-400 font-medium leading-relaxed italic border-t border-white/5 pt-4 mt-4">{edu.details}</p>
                    <div className="flex items-center gap-2 mt-6 text-xs font-bold text-slate-500 uppercase tracking-widest">
                      <i data-lucide="map-pin" className="w-4 h-4"></i> {edu.location}
                    </div>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </section>
    );

    const Certifications = () => {
      const allCerts = [...STUDENT_DATA.certifications, ...STUDENT_DATA.certifications];
      return (
        <section id="certifications" className="py-20 overflow-hidden relative">
          <div className="container mx-auto px-6">
            <div className="text-center mb-16" data-aos="fade-up">
              <h2 className="text-4xl md:text-5xl font-outfit font-black uppercase tracking-tighter">Certificates & <span className="text-secondary">Achievements</span></h2>
              <p className="text-slate-400 mt-4 font-bold uppercase tracking-widest text-sm">Click to view full certificate</p>
            </div>

            <div className="relative scroll-mask">
              <div className="flex animate-scroll gap-8 py-8 w-max">
                {allCerts.map((cert, idx) => (
                  <a
                    key={idx}
                    href={cert.link}
                    target="_blank"
                    className="glass-card p-6 rounded-[2.5rem] w-[300px] md:w-[350px] shrink-0 group relative overflow-hidden transition-all duration-500 hover:-translate-y-3 border-white/5 active:scale-95"
                  >
                    <div className="absolute top-0 right-0 w-32 h-32 bg-primary/5 rounded-full -mr-16 -mt-16 group-hover:scale-150 transition-transform duration-700"></div>
                    <div className="flex justify-between items-start mb-8 relative z-10">
                      <div className="p-4 glass border-primary/20 rounded-2xl transition-all duration-500 shadow-[0_0_20px_rgba(34,211,238,0.1)]">
                        <svg width="32" height="32" viewBox="0 0 37 37"><path d="M18.5 2L22.5 14H35L25.5 22L29.5 34L18.5 26L7.5 34L11.5 22L2 14H14.5L18.5 2Z" fill={cert.color} /></svg>
                      </div>
                      <span className="text-[10px] font-black text-primary uppercase tracking-[0.3em] bg-primary/10 px-3 py-1.5 rounded-full">{cert.date}</span>
                    </div>
                    <h3 className="text-xl font-black mb-2 text-white uppercase tracking-tight leading-tight group-hover:text-primary transition-colors h-14 overflow-hidden">{cert.name}</h3>
                    <p className="text-slate-500 mb-8 font-bold uppercase tracking-widest text-[10px]">{cert.platform}</p>
                    <div className="flex items-center gap-4 text-[10px] font-black text-primary uppercase tracking-[0.4em] group/link">
                      View Document
                      <span className="w-8 h-px bg-primary/40 group-hover/link:w-12 transition-all"></span>
                      <i data-lucide="external-link" className="w-4 h-4"></i>
                    </div>
                  </a>
                ))}
              </div>
            </div>
          </div>
        </section>
      );
    }

    const Contact = () => (
      <section id="contact" className="py-20 relative">
        <div className="container mx-auto px-6">
          <div className="glass-card rounded-[3rem] p-8 md:p-16 text-center relative overflow-hidden border-white/10 shadow-2xl">
            <div className="absolute top-0 right-0 w-96 h-96 bg-primary/10 blur-[150px] -mr-48 -mt-48"></div>
            <div className="absolute bottom-0 left-0 w-96 h-96 bg-secondary/10 blur-[150px] -ml-48 -mb-48"></div>

            <h2 className="text-4xl md:text-6xl font-outfit font-black mb-8 uppercase tracking-tighter animate-pulse-slow">Let's <span className="text-primary drop-shadow-[0_0_15px_rgba(34,211,238,0.5)]">Collaborate</span></h2>
            <p className="text-slate-400 text-xl mb-16 max-w-3xl mx-auto leading-relaxed font-medium">Currently seeking opportunities to shape the future of AI and Web. My inbox is always open.</p>

            <div className="grid md:grid-cols-2 gap-8 max-w-4xl mx-auto mb-16">
              <div className="glass p-8 rounded-[2rem] border-primary/20 hover:border-primary/50 transition-colors group">
                <p className="text-xs font-black text-primary uppercase tracking-[0.4em] mb-4">Direct Mail</p>
                <a href={`mailto:${STUDENT_DATA.email}`} className="text-xl md:text-2xl font-black text-white hover:text-primary transition-all break-all">{STUDENT_DATA.email}</a>
              </div>
              <div className="glass p-8 rounded-[2rem] border-secondary/20 hover:border-secondary/50 transition-colors">
                <p className="text-xs font-black text-secondary uppercase tracking-[0.4em] mb-4">Current Hub</p>
                <p className="text-2xl font-black text-white">{STUDENT_DATA.location}</p>
              </div>
            </div>

            <div className="flex flex-wrap justify-center gap-6">
              {Object.entries(STUDENT_DATA.socials).map(([k, v]) => (
                <a key={k} href={v} target="_blank" className="group flex items-center gap-3 glass px-8 py-4 rounded-[1.5rem] hover:bg-white/10 transition-all border-white/10">
                  <i data-lucide={k === 'leetcode' ? 'code-2' : k} className="w-5 h-5 text-primary group-hover:scale-125 transition-transform"></i>
                  <span className="text-xs font-black uppercase tracking-[0.3em] group-hover:text-primary transition-colors">{k}</span>
                </a>
              ))}
            </div>
          </div>
        </div>
      </section>
    );

    const App = () => {
      useEffect(() => {
        if (window.AOS) window.AOS.init({ duration: 1200, once: true, offset: 100 });
        if (window.lucide) window.lucide.createIcons();
      }, []);
      return (
        <div className="relative font-sans scrollbar-hide body-gradient min-h-screen">
          <ScrollProgressBar />
          <FloatingOrbs />
          <Nav />
          <main className="relative z-10">
            <Hero />
            <About />
            <Skills />
            <Projects />
            <Education />
            <Certifications />
            <Contact />
          </main>
          <BackToTop />
          <footer className="py-16 text-center text-slate-500 border-t border-white/5 relative z-10">
            <div className="flex flex-col items-center gap-6">
              <div className="text-2xl font-outfit font-black tracking-tighter">
                <span className="text-primary">Ayesha </span>
                <span className="text-white"> Fathima</span>
              </div>
              <p className="text-[10px] font-black uppercase tracking-[0.5em] opacity-40">© 2026 {STUDENT_DATA.name} | Crafted with React & Tailwind</p>
            </div>
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
</body>

</html>
